# Fly.io configuration for Resilience — Mission Operations Console
# Docs: https://fly.io/docs/reference/configuration/
#
# First-time setup:
#   brew install flyctl
#   flyctl auth login
#   flyctl launch --no-deploy          # creates the app, skip if already created
#   flyctl postgres create --name resilience-db
#   flyctl postgres attach resilience-db
#   flyctl secrets set RAILS_MASTER_KEY=$(cat backend/config/master.key)
#   flyctl secrets set SECRET_KEY_BASE=$(cd backend && bundle exec rails secret)
#   flyctl secrets set ANTHROPIC_API_KEY=sk-ant-...
#   flyctl secrets set SENTRY_DSN=https://backend-public-key@o0.ingest.sentry.io/0   # optional Rails error tracking
#   # Browser Sentry + source-map upload are build-time args, not Fly runtime env:
#   #   VITE_SENTRY_DSN
#   #   SENTRY_RELEASE
#   #   SENTRY_AUTH_TOKEN
#   #   SENTRY_ORG
#   #   SENTRY_PROJECT
#   flyctl deploy

app            = "resilience-ops"
primary_region = "iad"

[build]
  # Build from the repo root using the combined Dockerfile
  dockerfile = "Dockerfile"

[deploy]
  release_command = "bin/rails db:migrate"

[env]
  RAILS_ENV                = "production"
  RAILS_LOG_TO_STDOUT      = "true"
  # Serve the pre-built frontend from Rails' public/ directory
  RAILS_SERVE_STATIC_FILES = "true"
  # Run Solid Queue supervisor inside the Puma process (single-machine deploy)
  SOLID_QUEUE_IN_PUMA      = "true"
  # Thread count for 1 GB machine. With jemalloc each thread costs ~20–30 MB
  # in steady state. 20 threads leaves headroom for Solid Queue + OS overhead.
  # DB pool inherits this value from database.yml (pool: ENV["RAILS_MAX_THREADS"]).
  RAILS_MAX_THREADS        = "20"
  # SSE thread budget: 3 stream types × N concurrent users must fit inside
  # RAILS_MAX_THREADS while leaving headroom for regular API requests.
  # SSE_MAX_STREAMS_PER_USER=4  → up to 2 browser tabs per user (2 × 3 streams)
  # SSE_MAX_STREAMS_PER_IP=12   → up to 4 users from the same network
  # At full SSE occupancy (12 streams) 8 threads remain for API calls.
  SSE_MAX_STREAMS_PER_USER = "4"
  SSE_MAX_STREAMS_PER_IP   = "12"
  # Thruster listens on this port (non-root can't bind <1024 on Fly machines)
  THRUSTER_HTTP_PORT       = "8080"

[http_service]
  # Thruster/Puma listens on 8080; port 80 requires root which the non-root
  # rails user (uid 1000) does not have. Fly proxy handles external TLS/80/443.
  internal_port       = 8080
  force_https         = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  # Keep one machine warm so SSE feeds and signal threads start immediately.
  # Set to 0 to save cost (machine spins up on first request, ~3s cold start).
  min_machines_running = 1

  [http_service.concurrency]
    # Fly routes up to hard_limit connections to this machine before spinning
    # a second one. With RAILS_MAX_THREADS=20 and 12 max SSE streams, the
    # remaining 8 API threads should not be overwhelmed. hard_limit=25 keeps
    # at most 13 API connections queuing (25 - 12 SSE), matching real capacity.
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  size   = "shared-cpu-1x"
  memory = "1gb"
