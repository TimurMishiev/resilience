name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Frontend: type safety + lint + build ────────────────────────────────────
  frontend:
    name: Frontend — typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: TypeScript typecheck
        run: npx tsc --noEmit

      - name: ESLint
        run: yarn lint

      - name: Vitest unit tests
        run: yarn test

      - name: Build
        run: yarn build

  # ── Backend: security audit ─────────────────────────────────────────────────
  backend-security:
    name: Backend — Brakeman + bundler-audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true
          working-directory: backend

      - name: Brakeman static analysis
        run: bundle exec brakeman --no-pager --exit-on-warn

      - name: bundler-audit CVE check
        run: bundle exec bundler-audit check --update

  # ── Backend: RSpec unit tests ────────────────────────────────────────────────
  backend-tests:
    name: Backend — RSpec
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        # postgis/postgis:17-3.5 matches the production Postgres 17 version and
        # provides PostGIS so the ST_DWithin path in near_point is exercised in CI.
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: resilience_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/resilience_test
      JWT_SECRET: test_secret_for_ci_only

    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4.7'
          bundler-cache: true
          working-directory: backend

      - name: Set up database
        run: bundle exec rails db:schema:load

      - name: Verify migrations are in sync with structure.sql
        run: bundle exec rails db:migrate && bundle exec rails db:schema:dump && git diff --exit-code db/structure.sql

      - name: Run specs
        run: bundle exec rspec --format progress

  frontend-perf:
    name: Frontend — Globe benchmark
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install frontend dependencies
        run: yarn install --frozen-lockfile
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
        working-directory: frontend

      - name: Start Dockerized app
        run: docker compose up -d --build

      - name: Wait for app
        run: |
          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000/login >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "App did not become ready in time" >&2
          docker compose logs --tail=200
          exit 1

      - name: Run globe benchmark
        run: E2E_BASE_URL=http://127.0.0.1:3000 yarn benchmark:globe
        working-directory: frontend

      - name: Stop Dockerized app
        if: always()
        run: docker compose down -v

  # ── Deploy to Fly.io (main branch only, all checks must pass) ───────────────
  deploy:
    name: Deploy — Fly.io
    runs-on: ubuntu-latest
    needs: [frontend, backend-security, backend-tests, frontend-perf]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      VITE_SENTRY_DSN: ${{ secrets.VITE_SENTRY_DSN }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_RELEASE: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        if: env.FLY_API_TOKEN != ''
        run: |
          args=()
          [ -n "$VITE_SENTRY_DSN" ] && args+=(--build-arg "VITE_SENTRY_DSN=$VITE_SENTRY_DSN")
          [ -n "$SENTRY_RELEASE" ] && args+=(--build-arg "SENTRY_RELEASE=$SENTRY_RELEASE")
          [ -n "$SENTRY_AUTH_TOKEN" ] && args+=(--build-arg "SENTRY_AUTH_TOKEN=$SENTRY_AUTH_TOKEN")
          [ -n "$SENTRY_ORG" ] && args+=(--build-arg "SENTRY_ORG=$SENTRY_ORG")
          [ -n "$SENTRY_PROJECT" ] && args+=(--build-arg "SENTRY_PROJECT=$SENTRY_PROJECT")
          flyctl deploy --remote-only "${args[@]}"
