# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  telemetry_prepare_partitions:
    class: Telemetry::PreparePartitionsJob
    queue: background
    schedule: every day at 12:05am

  telemetry_prune_partitions:
    class: Telemetry::PrunePartitionsJob
    queue: background
    schedule: every day at 4:20am

  vessel_track_retention:
    class: Vessels::TrackRetentionJob
    queue: background
    schedule: every day at 3am

  vessel_gap_detection:
    class: Vessels::GapDetectionJob
    queue: background
    schedule: every 5 minutes

  vessel_loitering_detection:
    class: Vessels::LoiteringDetectionJob
    queue: background
    schedule: every 5 minutes

  risk_snapshot:
    class: Risk::SnapshotJob
    queue: background
    schedule: every hour at minute 30

  recommendation_generation:
    class: Recommendations::GenerationJob
    queue: background
    schedule: every 30 minutes

  sse_lease_cleanup:
    class: Sse::LeaseCleanupJob
    queue: background
    schedule: every 5 minutes

  # ── Correlation engine (replaces boot-time thread) ───────────────────────
  correlation_evaluate_recent:
    class: Correlations::EvaluateRecentJob
    queue: background
    schedule: every 10 seconds

  # ── Feed ingestion (replaces boot-time threads) ──────────────────────────
  feed_opensky:
    class: Feeds::PollJob
    queue: background
    args: [ "opensky" ]
    schedule: every 15 minutes

  feed_usgs:
    class: Feeds::PollJob
    queue: background
    args: [ "usgs" ]
    schedule: every 5 minutes

  feed_gpsjam:
    class: Feeds::PollJob
    queue: background
    args: [ "gpsjam" ]
    schedule: every 15 minutes

  feed_ais:
    class: Feeds::PollJob
    queue: background
    args: [ "ais" ]
    schedule: every 30 seconds

  feed_firms:
    class: Feeds::PollJob
    queue: background
    args: [ "firms" ]
    schedule: every 15 minutes

  feed_gdacs:
    class: Feeds::PollJob
    queue: background
    args: [ "gdacs" ]
    schedule: every 15 minutes

  feed_acled:
    class: Feeds::PollJob
    queue: background
    args: [ "acled" ]
    schedule: every hour

