production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  vessel_track_retention:
    class: Vessels::TrackRetentionJob
    queue: background
    schedule: every day at 3am

  vessel_gap_detection:
    class: Vessels::GapDetectionJob
    queue: background
    schedule: every 5 minutes

  risk_snapshot:
    class: Risk::SnapshotJob
    queue: background
    schedule: every hour at minute 30

  recommendation_generation:
    class: Recommendations::GenerationJob
    queue: background
    schedule: every 30 minutes

development:
  vessel_gap_detection:
    class: Vessels::GapDetectionJob
    queue: background
    schedule: every 5 minutes

  risk_snapshot:
    class: Risk::SnapshotJob
    queue: background
    schedule: every hour at minute 30

  recommendation_generation:
    class: Recommendations::GenerationJob
    queue: background
    schedule: every 30 minutes
