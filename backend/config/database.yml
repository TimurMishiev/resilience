default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  port: 5432

development:
  <<: *default
  database: resilience_development
  pool: 70

test:
  <<: *default
  port: <%= ENV.fetch("TEST_DATABASE_PORT", ENV.fetch("DATABASE_PORT", 5432)) %>
  database: resilience_test

production:
  primary: &primary_production
    <<: *default
    # DATABASE_URL takes full precedence when set (Fly.io / Heroku / Render).
    # Falls back to individual vars for local production-mode testing.
    # sslmode: prefer — attempts TLS, falls back gracefully on Fly.io's
    # WireGuard private network (which encrypts at transport layer anyway).
    # Override to "require" in DATABASE_URL if your Postgres instance mandates it.
    url:      <%= ENV["DATABASE_URL"] %>
    database: resilience_production
    username: <%= ENV["DATABASE_USERNAME"] %>
    password: <%= ENV["DATABASE_PASSWORD"] %>
    host:     <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
    sslmode:  prefer
  cache:
    <<: *primary_production
    # When DATABASE_URL is set all three databases share the same instance;
    # Solid Cache tables live alongside app tables. Fine for a single-server deploy.
    database: resilience_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: resilience_production_queue
    migrations_paths: db/queue_migrate
