default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  host: localhost
  port: 5432

development:
  <<: *default
  database: resilience_development
  pool: 70

test:
  <<: *default
  port: <%= ENV.fetch("TEST_DATABASE_PORT", ENV.fetch("DATABASE_PORT", 5432)) %>
  database: resilience_test

production:
  primary: &primary_production
    <<: *default
    # DATABASE_URL takes full precedence when set (Fly.io / Heroku / Render).
    # Falls back to individual vars for local production-mode testing.
    # sslmode: prefer — attempts TLS, falls back gracefully on Fly.io's
    # WireGuard private network (which encrypts at transport layer anyway).
    # Override to "require" in DATABASE_URL if your Postgres instance mandates it.
    url:      <%= ENV["DATABASE_URL"] %>
    database: resilience_production
    username: <%= ENV["DATABASE_USERNAME"] %>
    password: <%= ENV["DATABASE_PASSWORD"] %>
    host:     <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
    sslmode:  prefer
    # Puma threads (RAILS_MAX_THREADS) + Solid Queue workers (in-puma mode) share
    # the primary pool. Add headroom so SQ dispatchers/workers don't starve API
    # threads when the pool is under contention.
    pool:     <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS") { 5 }.to_i + 5 } %>
    # Per-connection statement_timeout guards against a runaway query holding a
    # pool slot indefinitely. Long-running background jobs that legitimately
    # need more time should bump it per-transaction with
    #   ActiveRecord::Base.connection.execute("SET LOCAL statement_timeout = '5min'")
    variables:
      statement_timeout: <%= ENV.fetch("DB_STATEMENT_TIMEOUT_MS", 30_000) %>
  cache:
    <<: *primary_production
    # When DATABASE_URL is set all three databases share the same instance;
    # Solid Cache tables live alongside app tables. Fine for a single-server deploy.
    database: resilience_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: resilience_production_queue
    migrations_paths: db/queue_migrate
